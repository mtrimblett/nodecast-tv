version: '3.8'

services:
  nodecast-tv:
    image: nodecast-tv:local
    container_name: nodecast-tv
    restart: unless-stopped
    dns:
      - 192.168.37.8
      - 192.168.37.9
    volumes:
      - /share/CACHEDEV1_DATA/Container/nodecast-tv/data:/app/data
    devices:
      - /dev/dri:/dev/dri # Required for Intel QuickSync (N5095)
    shm_size: '1gb' # Optimized for transcoding buffers
    deploy:
      resources:
        limits:
          memory: 2G
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      qnet-static-eth1-2a77c7:
        ipv4_address: 192.168.37.55

networks:
  qnet-static-eth1-2a77c7:
    external:
      name: qnet-static-eth1-2a77c7
